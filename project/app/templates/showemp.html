<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        /* === SAME CSS, NO CHANGE === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 40px
        }

        .nav-link {
            display: block;
            padding: 14px 20px;
            margin-bottom: 12px;
            border-radius: 10px;
            color: #c7d2fe;
            text-decoration: none;
            transition: .3s;
        }

        .nav-link:hover,
        .nav-link.active {
            background: #4f46e5;
            color: #fff;
            transform: translateX(6px);
        }

        .main {
            flex: 1;
            padding: 30px
        }

        .topbar {
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .1);
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 10px 10px 10px rgba(0, 0, 0, .2);
        }

        thead {
            background: #000;
            color: #fff
        }

        th,
        td {
            padding: 14px;
            text-align: center
        }

        tbody tr:hover {
            background: #eef2ff
        }

        .salary-btn {
            background: linear-gradient(45deg, #84a8f7, #6668e8);
            color: #fff;
            padding: 10px 22px;
            border-radius: 10px;
            text-decoration: none;
            cursor: pointer;
        }

        .edit-btn {
            background: #22c55e;
            color: #fff;
            padding: 7px 14px;
            border-radius: 8px;
            text-decoration: none;
        }

        .delete-btn {
            background: linear-gradient(45deg, #f44a4a, #ff6b6b);
            color: #fff;
            padding: 7px 14px;
            border-radius: 8px;
            text-decoration: none;
        }

        .pay-popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, .8);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: .2s;
            z-index: 9999;
        }

        .pay-popup.active {
            opacity: 1;
            pointer-events: auto;
        }

        .pay-box {
            background: #fff;
            width: 420px;
            padding: 30px;
            border-radius: 20px;
            position: relative;
        }

        .close-pay {
            position: absolute;
            top: 10px;
            right: 16px;
            font-size: 26px;
            cursor: pointer;
        }

        .emp-details {
            background: #f1f5f9;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .pay-now {
            width: 100%;
            padding: 14px;
            background: #4f46e5;
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2>Admin Panel</h2>
        <a class="nav-link active" href="{% url 'admindashboard' %}">Dashboard</a>
        <a class="nav-link" href="{% url 'add_emp' %}">Add Employee</a>
        <a class="nav-link" href="{% url 'show_emp' %}">All Employees</a>
        <a class="nav-link" href="{% url 'showquery' %}">Queries</a>
        <a class="nav-link" href="{% url 'logout' %}">Logout</a>
    </div>

    <div class="main">
        <div class="topbar">
            <h3>Welcome !</h3>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Emp ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Contact</th>
                    <th>Position</th>
                    <th>Salary</th>
                    <th>Password</th>
                    <th>Pay</th>
                    <th>Edit</th>
                    <th>Delete</th>
                </tr>
            </thead>
            <tbody>
                {% for i in emp %}
                <tr>
                    <td>{{ i.empid }}</td>
                    <td>{{ i.name }}</td>
                    <td>{{ i.email }}</td>
                    <td>{{ i.contact }}</td>
                    <td>{{ i.position }}</td>
                    <td>{{ i.salary }}</td>
                    <td>{{ i.Password }}</td>
                    <td>
                        <a href="{% url 'Pay_salary' pk=i.id %}" class="salary-btn">
                            Pay
                        </a>
                    </td>
                    <td><a href="{% url 'edit_employee' pk=i.id %}" class="edit-btn">Edit</a></td>
                    <td><a href="{% url 'del_employee' pk=i.id %}" class="delete-btn">Delete</a></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>

</html>
